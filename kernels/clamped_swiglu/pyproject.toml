[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cake-pplx-clamped-swiglu"
dynamic = ["version"]
description = "Cake clamped_swiglu training kernels (det) for Perplexity"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch",
    "apache-tvm-ffi>=0.1.11,<0.2",
]

[project.optional-dependencies]
# The locality="domain" path on R200 (sm_107a): cuda-python's driver bindings with the locality-domain names.
locality = ["cuda-bindings>=13.5"]
test = ["pytest", "numpy"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["."]
include = ["cake_pplx*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["build.json", "build.test.json", "README.md", "csrc/**/*", ".gitignore"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "cpu_only: identifies tests that do not use any GPU; does not change test behavior",
]
